<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Ash";
      src: url("Ash-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Ash";
      src: url("Ash-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }
    html, body {
      margin: 0;
      width: 1200px;
      height: 264px;
      overflow: hidden;
      background: #0c0c0d;
    }
    .card {
      position: relative;
      width: 1200px;
      height: 264px;
    }
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 62%;
    }
    .vignette {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right, rgba(12, 12, 13, 0.42) 0%, rgba(12, 12, 13, 0.12) 42%, transparent 70%),
        linear-gradient(to bottom, transparent 0%, transparent 78%, rgba(12, 12, 13, 0.28) 100%);
    }
    .lockup {
      position: absolute;
      left: 48px;
      top: 36%;
      transform: translateY(-50%);
      max-width: 46%;
    }
    h1 {
      margin: 0;
      font-family: "Ash", "Liberation Sans Narrow", sans-serif;
      font-weight: 700;
      font-size: 64px;
      letter-spacing: 0.26em;
      color: #f3f2ef;
      line-height: 1;
      padding-left: 0.26em;
      white-space: nowrap;
      text-shadow: 0 2px 18px rgba(12, 12, 13, 0.75);
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="bg" src="cover-src.jpg" alt="" />
    <div class="vignette"></div>
    <div class="lockup">
      <h1>ASHLINE</h1>
    </div>
  </div>
</body>
</html>
