<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Ash";
      src: url("Ash-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Ash";
      src: url("Ash-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0c0c0d;
    }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
    }
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 58%;
    }
    .vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 44%, rgba(12, 12, 13, 0.08) 18%, rgba(12, 12, 13, 0.42) 100%),
        linear-gradient(to bottom, rgba(12, 12, 13, 0.18) 0%, transparent 28%, transparent 72%, rgba(12, 12, 13, 0.28) 100%);
    }
    .lockup {
      position: absolute;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 72%;
    }
    h1 {
      margin: 0;
      font-family: "Ash", "Liberation Sans Narrow", sans-serif;
      font-weight: 700;
      font-size: 118px;
      letter-spacing: 0.28em;
      color: #f3f2ef;
      line-height: 1;
      padding-left: 0.28em;
      white-space: nowrap;
      text-shadow: 0 2px 28px rgba(12, 12, 13, 0.72);
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="bg" src="cover-src.jpg" alt="" />
    <div class="vignette"></div>
    <div class="lockup">
      <h1>ASHLINE</h1>
    </div>
  </div>
</body>
</html>
